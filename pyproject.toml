[build-system]
requires = ["setuptools>=62.6"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ['mava*']

[project]
name = "id-mava"
authors = [{ name = "InstaDeep Ltd" }]
dynamic = ["version"]
license = { file = "LICENSE" }
description = "Distributed Multi-Agent Reinforcement Learning in JAX."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "multi-agent",
  "reinforcement learning",
  "python",
  "jax",
  "anakin",
  "sebulba",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  # --- L2RPN fork: exact pins relaxed to floors so Mava can co-resolve with the
  # --- competition stack (Python 3.13, numpy 2.x, newer jax). See git history.
  # --- Benchmark-environment deps are TRIMMED (commented out): brax/mujoco/jaxmarl/
  # --- gigastep/smaclite/jumanji/rware/lbforaging/matrax are Mava's example envs and
  # --- are anchored to the numpy-1.x / jax-0.5.3 world; they are not needed to run
  # --- Mava's algorithms on grid2op. Only the JAX algorithm core is kept.
  "colorama",
  "distrax",
  "flashbax~=0.1.0",
  "flax>=0.8.1",
  "gymnasium>=1.0.0",
  "hydra-core>=1.3.2",
  "jax>=0.5.3",
  "jaxlib>=0.5.3",
  "jraph",
  "jumanji>=1.1.1",  # CORE: mava/types.py + every systems/*/types.py import jumanji.types.TimeStep
  "neptune",
  "numpy>=1.26.4",
  "omegaconf",
  "optax",
  "protobuf>=3.20",
  "scipy>=1.12.0",
  "setuptools",
  "tensorboard_logger",
  "tensorflow_probability",
  "type_enforced",
  # --- trimmed benchmark envs (restore individually if a specific env is needed):
  # "brax>=0.10.3",
  # "gigastep @ git+https://github.com/mlech26l/gigastep",
  # "jaxmarl @ git+https://github.com/RuanJohn/JaxMARL@jax-05",
  # "lbforaging",
  # "matrax>= 0.0.5",
  # "mujoco>=3.1.3",
  # "mujoco-mjx>=3.1.3",
  # "rware",
  # "smaclite @ git+https://github.com/uoe-agents/smaclite.git",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.5.3"]
tpu = ["jax[tpu]>=0.5.3"]
# Optional JSON-logging backend (marl-eval). Pulls rliable+arch and needs CMake to
# build; not required for training. Install with: uv pip install -e ./Mava[eval]
eval = ["id-marl-eval @ git+https://github.com/instadeepai/marl-eval"]

[dependency-groups]
dev = ["mypy", "pre-commit", "pytest"]

[tool.setuptools.dynamic]
version = { attr = "mava.__version__" }

[project.urls]
"Homepage" = "https://github.com/instadeep/Mava"
"Bug Tracker" = "https://github.com/instadeep/Mava/issues"

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
disallow_untyped_defs = true
strict_equality = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "W", "RUF", "ANN"]
ignore = [
  "E731",   # Allow lambdas to be assigned to variables.
  "ANN101", # no need to type self
  "ANN102", # no need to type cls
  "ANN204", # no need for return type for special methods
  "ANN401", # can use Any type
]

[tool.ruff.lint.pep8-naming]
ignore-names = ["?"]
